<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Э-Күндөлүк (Класс)</title>
    <link rel="stylesheet" href="style.css?v=99">
</head>
<body>

    <div class="header">
        <div class="top-bar">
            <h1>Э-Күндөлүк</h1>
            <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
        
        <div class="controls-grid">
            <input type="date" id="datePicker">
            <button class="btn-main" onclick="markAllPresent()">Все есть</button>
            <button class="btn-main btn-wa" onclick="copyWhatsAppReport()">📋 WhatsApp</button>
            <button class="btn-main btn-stats" onclick="openStats()">📊 Статистика</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Найти ученика..." oninput="render()">
        </div>
    </div>

    <div id="studentsList"></div>

    <div class="modal" id="statsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Статистика</h2>
                <button class="modal-close" onclick="closeStats()">&times;</button>
            </div>
            <div id="statsBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
