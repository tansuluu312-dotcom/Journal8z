<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Э-Күндөлүк (Класс)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем библиотеку для создания чистого Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <div class="header">
        <div class="top-bar">
            <h1>Э-Күндөлүк</h1>
            <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
        <div class="controls">
            <input type="date" id="datePicker">
            <button class="btn-main" onclick="markAllPresent()">Все присутствуют</button>
            <button class="btn-main" style="background-color: #107c41;" onclick="exportToExcel()">Скачать Excel</button>
        </div>
    </div>

    <div id="studentsList"></div>

    <script src="script.js"></script>
</body>
</html>
