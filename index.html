<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Э-Күндөлүк (8-З)</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <div class="header">
        <div class="top-bar">
            <h1>Э-Күндөлүк (8-З)</h1>
            <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
        
        <div class="controls-grid">
            <input type="date" id="datePicker">
            <button class="btn-main admin-only" onclick="markAllPresent()">Все есть</button>
            <button class="btn-main btn-wa admin-only" onclick="copyWhatsAppReport()">📋 WhatsApp</button>
            <button class="btn-main btn-stats" onclick="openStats()">📊 Статистика</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Найти ученика..." oninput="render()">
        </div>
    </div>

    <div id="studentsList"></div>

    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="script.js?v=3"></script>
</body>
</html>
